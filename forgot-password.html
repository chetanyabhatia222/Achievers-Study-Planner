<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Achievers</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="form-box">
            <form id="forgotForm" class="input-group">
                <h2>Reset Password</h2>
                <p style="color: #7f8c8d; font-size: 0.85rem; margin-bottom: 15px;">
                    Enter your registered email and we'll send you a reset link.
                </p>
                <input type="email" placeholder="Registered Email ID" required>
                <button type="submit" class="submit-btn">Send Reset Link</button>
                <p class="toggle-text"><a href="login.html" style="color: #3498db; text-decoration: none; font-weight: 600;">&#8592; Back to Login</a></p>
            </form>

            <div id="success-msg" class="success-box hidden">
                <div class="checkmark">&#10003;</div>
                <h2>Email Sent!</h2>
                <p>Check your inbox for the password reset link.</p>
                <a href="login.html" class="back-login-btn">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').onsubmit = function(e) {
            e.preventDefault();
            this.classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
        };
    </script>
</body>
</html>
